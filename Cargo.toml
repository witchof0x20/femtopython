[package]
name = "femtopython"
version = "0.1.0"
edition = "2024"
description = "A small, strictly-typed, embeddable subset of Python"

[dependencies]
clap = { version = "4.6.8", features = ["derive"], optional = true }
ctrlc = { version = "3.5.2", optional = true }
indexmap = "2.14.2"
lalrpop-util = { version = "0.23.2", default-features = false, features = ["std"] }
rustyline = { version = "19.0.0", optional = true }
stacker = "0.1.25"

[build-dependencies]
lalrpop = { version = "0.23.2", default-features = false }

[features]
default = ["repl"]
# The interactive `femtopython` binary. Disable with `default-features = false`
# when embedding to avoid pulling in clap/rustyline.
repl = ["dep:clap", "dep:rustyline", "dep:ctrlc"]

[[bin]]
name = "femtopython"
path = "src/bin/femtopython.rs"
required-features = ["repl"]
